name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: viewer/go.sum

      - name: Install JS dependencies
        run: npm ci
        env:
          # build explicitly in the next step for clearer logs
          PIVIEW_SKIP_VIEWER_BUILD: "1"

      - name: Typecheck
        run: npm run check

      - name: Build viewer
        run: npm run build:viewer

      - name: Smoke test
        run: npm test
